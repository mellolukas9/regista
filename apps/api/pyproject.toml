[project]
name = "regista-api"
version = "0.0.0"
description = "Regista API (FastAPI)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.142",
    "uvicorn[standard]>=0.54",
    "sqlalchemy[asyncio]>=2.1.1",
    "asyncpg>=0.31",
    "alembic>=1.20",
    "pydantic>=2.13",
    "pydantic-settings>=2.15",
    "structlog>=26.1",
    "argon2-cffi>=25.1",
    "pyotp>=2.9",
    "cryptography>=46.0",
    # Pinned: its schema is applied by our Alembic migrations. To upgrade, add a migration that
    # runs the library's SQL migrations between the old and new version (see ADR 0018).
    "procrastinate==3.10.0",
    "psycopg[binary,pool]>=3.3.6",
]

[project.scripts]
regista-admin = "regista_api.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/regista_api"]
