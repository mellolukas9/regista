[project]
name = "regista"
version = "0.0.0"
description = "Regista v2 workspace"
requires-python = ">=3.12"
dependencies = []

[tool.uv.workspace]
members = ["apps/api", "sdk", "agent"]

[tool.uv.sources]
regista-api = { workspace = true }
regista-sdk = { workspace = true }
regista-agent = { workspace = true }

[dependency-groups]
dev = [
    "regista-api",
    "regista-sdk",
    "regista-agent",
    "pytest>=9.1",
    "pytest-asyncio>=1.4",
    "testcontainers[postgres]>=4.15",
    "httpx>=0.28",
    "ruff>=0.16",
    "mypy>=2.3",
    "pre-commit>=4.6",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["apps/web", "docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["regista_api", "regista", "regista_agent"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101", "S105", "S106"]
# Migration SQL is static (constants only); S608 flags the f-string composition.
"**/migrations/**" = ["S608"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = ["apps/api/src", "sdk/src", "agent/src"]
explicit_package_bases = true
files = ["apps/api", "sdk", "agent"]
exclude = ["migrations/versions/"]

[[tool.mypy.overrides]]
# boto3 ships no types; the S3 calls are wrapped in `regista_api.storage`.
module = ["boto3", "boto3.*", "botocore", "botocore.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["apps/api/tests", "sdk/tests", "agent/tests"]
addopts = "--import-mode=importlib"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = [
    "e2e: starts the real API, worker and agent as separate processes (slower)",
]
filterwarnings = [
    # The suite overrides `event_loop_policy` (psycopg needs the selector loop on Windows). The
    # replacement hook the warning points to is not in pytest-asyncio 1.4 yet. When the fixture
    # is removed the tests fail loudly on Windows, so this cannot hide a regression.
    'ignore:Overriding the "event_loop_policy" fixture is deprecated:pytest.PytestDeprecationWarning',
]
