name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python (ruff, mypy, pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      # Testcontainers starts Postgres 18 through the runner's Docker.
      - run: uv run pytest

  # The agent keeps its key with DPAPI and a restricted ACL on Windows, which cannot be tested on
  # Linux. The runner is an administrator, so the tests that create local users run here (and
  # are skipped, with the reason, on a developer's unelevated session).
  agent-windows:
    name: Agent on Windows (DPAPI, ACLs, services, robot host)
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      # Installs the real services (NT SERVICE accounts) and runs signed probe robots through the
      # robot host (agent/tests/test_windows_host.py, ADR 0022). Only this job sets it.
      REGISTA_TEST_REAL_SERVICES: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run pytest agent/tests -v -rs

  web:
    name: Web (lint, typecheck, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
