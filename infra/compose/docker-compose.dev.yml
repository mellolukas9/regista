name: regista-dev

services:
  postgres:
    image: postgres:18
    container_name: regista-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev-superuser-password}
      POSTGRES_DB: regista
      REGISTA_OWNER_PASSWORD: ${REGISTA_OWNER_PASSWORD:-dev-owner-password}
      REGISTA_APP_PASSWORD: ${REGISTA_APP_PASSWORD:-dev-app-password}
    ports:
      - "5432:5432"
    volumes:
      # Postgres 18+: o diretório de dados fica em subpasta versionada de /var/lib/postgresql
      - pgdata:/var/lib/postgresql
      # Só roda com o volume vazio (primeira inicialização)
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d regista"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
