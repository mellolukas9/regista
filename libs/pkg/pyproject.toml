[project]
name = "regista-pkg"
version = "0.0.0"
description = "Signed robot package format shared by the API, the agent and regista-pack (ADR 0021)"
requires-python = ">=3.12"
dependencies = [
    "cryptography>=46.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/regista_pkg"]
